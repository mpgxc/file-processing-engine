name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: development
    env:
      AWS_REGION: us-east-1
      ECR_REPO: report-service-api
      ECS_CLUSTER: report-service
      ECS_SERVICE: report-service-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 1. Build and push Docker image for the NestJS REST API (ECS Fargate)
      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API Docker image
        run: |
          ECR_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}"
          docker build -t "$ECR_URI:${{ github.sha }}" -t "$ECR_URI:latest" .
          docker push "$ECR_URI:${{ github.sha }}"
          docker push "$ECR_URI:latest"
          echo "IMAGE_URI=$ECR_URI:${{ github.sha }}" >> $GITHUB_ENV

      # 2. Update ECS service with new image
      - name: Deploy new image to ECS
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition report-service-api-task \
            --query 'taskDefinition' --output json)
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE
             | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"

      # 3. Build and deploy Lambda workers via CDK
      - name: Build Lambda workers
        run: npm ci && npm run build:lambdas

      - name: Deploy Lambda workers (CDK)
        working-directory: infra
        run: |
          npm ci
          npx cdk deploy ReportServiceWorkers ReportServiceCore ReportServiceStorage \
            --require-approval never -c environment=dev --outputs-file cdk-outputs.json

      - uses: actions/upload-artifact@v4
        with:
          name: cdk-outputs-dev
          path: infra/cdk-outputs.json

  deploy-staging:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: us-east-1
      ECR_REPO: report-service-api
      ECS_CLUSTER: report-service
      ECS_SERVICE: report-service-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_STAGING }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Promote image to staging
        run: |
          ECR_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}"
          docker pull "$ECR_URI:${{ github.sha }}"
          docker tag "$ECR_URI:${{ github.sha }}" "$ECR_URI:staging"
          docker push "$ECR_URI:staging"
      - name: Deploy to ECS staging
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"
      - run: npm ci && npm run build:lambdas
      - working-directory: infra
        run: npm ci && npx cdk deploy ReportServiceWorkers --require-approval never -c environment=staging

  deploy-prod:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      ECR_REPO: report-service-api
      ECS_CLUSTER: report-service
      ECS_SERVICE: report-service-api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Promote image to prod
        run: |
          ECR_URI="${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}"
          docker pull "$ECR_URI:${{ github.sha }}"
          docker tag "$ECR_URI:${{ github.sha }}" "$ECR_URI:prod"
          docker push "$ECR_URI:prod"
      - name: Deploy to ECS prod
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}"
      - run: npm ci && npm run build:lambdas
      - working-directory: infra
        run: npm ci && npx cdk deploy ReportServiceWorkers --require-approval never -c environment=prod
