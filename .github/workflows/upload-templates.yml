name: Upload Templates

on:
  push:
    paths:
      - 'fixtures/templates/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Validate Handlebars templates
        run: |
          find fixtures/templates -name "*.hbs" | while read f; do
            node -e "const fs=require('fs');const hbs=require('handlebars');hbs.compile(fs.readFileSync('$f','utf8'));console.log('OK: $f')"
          done
      - name: Validate JSON schemas
        run: |
          find fixtures/templates -name "*.json" | while read f; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'));console.log('OK: $f')"
          done
      - name: Sync templates to S3
        run: aws s3 sync fixtures/templates/ s3://${{ secrets.TEMPLATE_BUCKET_NAME }}/
      - name: Update template registry
        run: npm ci && npm run seed:local
        env:
          AWS_DYNAMODB_ENDPOINT: ''
          JOBS_TABLE_NAME: report_jobs
          TEMPLATES_TABLE_NAME: report_templates
